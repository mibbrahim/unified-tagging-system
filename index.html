<title>Unified Tagging System · Prototype</title>

/* Built on a Tailwind component library: Inter, gray-50 canvas, white cards (rounded-xl, gray-200 border, shadow-sm),
   blue-600 pill buttons, multi-select dropdown with tag pills, Advance Search Grid, header + tertiary tabs, KPI cards, success alerts,
   purple reserved for AI. Single light theme, matching the product. */
:root{color-scheme:light}
[hidden]{display:none!important}
body{margin:0;background:#F9FAFB;color:#1F2937;font-family:Inter,"Segoe UI",Arial,sans-serif;padding-block:0 40px}
.gutter{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
button{cursor:pointer}
:focus-visible{outline:2px solid #3B82F6;outline-offset:2px}

/* custom-checkbox / custom-radio: copied from the component library */
.custom-checkbox{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:2px solid #0075FF;border-radius:4px;background:#fff;display:inline-block;position:relative;cursor:pointer;flex:none}
.custom-checkbox:checked{background:#0075FF;border-color:#0075FF}
.custom-checkbox:checked::after{content:"";position:absolute;left:3px;top:0;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.cb{width:16px;height:16px;border:2px solid #0075FF;border-radius:4px;background:#fff;position:relative;flex:none}
.cb.on{background:#0075FF}
.cb.on::after{content:"";position:absolute;left:3px;top:0;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.custom-radio{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:2px solid #3377FF;border-radius:50%;background:#fff;position:relative;cursor:pointer;flex:none}
.custom-radio:checked::before{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#3377FF;top:2px;left:2px}

/* success alert: slide in + loading line, as in the library */
@keyframes slideIn{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.alert-in{animation:slideIn .35s ease-out}
@keyframes shrink{from{width:100%}to{width:0}}
.loading-line{position:absolute;left:0;bottom:0;height:3px;background:#22C55E;animation:shrink 5.2s linear forwards}
@media (prefers-reduced-motion: reduce){.alert-in,.loading-line{animation:none}}

/* device stage */
.device{width:100%;margin:0 auto;transition:max-width .3s ease}
.device[data-device="desktop"]{max-width:1120px}
.device[data-device="tablet"]{max-width:820px;border:12px solid #1F2937;border-radius:32px;background:#1F2937}
.device[data-device="mobile"]{max-width:390px;border:10px solid #1F2937;border-radius:44px;background:#1F2937}
.screen{position:relative;height:720px;overflow:hidden;container-type:inline-size;container-name:app;display:flex;flex-direction:column;background:#F9FAFB}
.device[data-device="desktop"] .screen{border:1px solid #E5E7EB;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.device[data-device="tablet"] .screen{border-radius:20px}
.device[data-device="mobile"] .screen{height:760px;border-radius:34px}

/* picker placement: popover (desktop) / side sheet (tablet) / bottom sheet (mobile) */
.picker{position:absolute;z-index:30;width:360px;max-height:440px}
.only-mobile{display:none!important}
@container app (max-width: 900px){
  .picker{transform:none!important;left:auto!important;top:0!important;right:0;bottom:0;width:min(380px,92%);max-height:none;border-radius:0!important;border-width:0 0 0 1px!important}
  .col-stage{display:none}
  .scrim{display:block!important}
}
@container app (max-width: 520px){
  .picker{left:0!important;right:0;top:auto!important;bottom:0;width:100%;max-height:84%;border-radius:20px 20px 0 0!important;border-width:1px 0 0 0!important}
  .only-desktop{display:none!important}
  .only-mobile{display:flex!important}
  .grid-table{display:none}
  .card-list{display:flex!important}
  .opt{min-height:44px}
  .alert-slot{left:12px;right:12px;top:auto;bottom:84px}
  .alert-slot>div{width:auto!important}
  .pad-app{padding:12px!important}
}
.card-list{display:none}
.alert-slot{position:absolute;top:16px;right:16px;z-index:40}

/* screenshot mode (#shot) */
.shot header.pagehead,.shot .guide{display:none}
.shot .layout{display:block}
.shot body{padding:12px}
.shot .gutter{padding:0}
</style>
</head>

<header class="pagehead bg-white shadow-sm mb-6">
  <div class="gutter max-w-[1432px] mx-auto flex flex-wrap items-center justify-between gap-4 py-4">
    <div>
      <h1 class="text-lg font-semibold text-gray-800">Unified Tagging System</h1>
      <p class="text-sm text-gray-500">Interactive prototype · one tag engine, every device</p>
    </div>
    <div class="flex flex-wrap items-center gap-4">
      <div class="flex items-center gap-2">
        <span class="text-xs font-medium text-gray-500" id="devlbl">Device</span>
        <div class="flex gap-1 bg-gray-100 px-1.5 py-1.5 rounded-md shadow-sm text-sm font-medium" role="group" aria-labelledby="devlbl" id="devSeg">
          <button id="dev-desktop" data-dev="desktop" class="seg px-3 py-1 rounded" aria-pressed="true">Desktop</button>
          <button id="dev-tablet" data-dev="tablet" class="seg px-3 py-1 rounded" aria-pressed="false">Tablet</button>
          <button id="dev-mobile" data-dev="mobile" class="seg px-3 py-1 rounded" aria-pressed="false">Mobile</button>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-xs font-medium text-gray-500" id="perlbl">Persona</span>
        <div class="flex gap-1 bg-gray-100 px-1.5 py-1.5 rounded-md shadow-sm text-sm font-medium" role="group" aria-labelledby="perlbl" id="perSeg">
          <button id="per-employer" data-per="employer" class="seg px-3 py-1 rounded" aria-pressed="true">Hiring team</button>
          <button id="per-seeker" data-per="seeker" class="seg px-3 py-1 rounded" aria-pressed="false">Job seeker</button>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="layout gutter max-w-[1432px] mx-auto grid gap-6 items-start" style="grid-template-columns:minmax(0,1fr)">
  <div class="min-w-0">
    <div class="device" id="device" data-device="desktop"><div class="screen" id="screen"></div></div>
  </div>
  <aside class="guide bg-white border border-gray-200 rounded-xl shadow-sm p-5 flex flex-col gap-4" aria-label="Things to try">
    <div>
      <h2 class="text-base font-semibold text-gray-800">Things to try</h2>
      <p class="text-sm text-gray-500 mt-1">Ticks itself as you go.</p>
    </div>
    <ul id="tasks" class="flex flex-col gap-3 text-sm text-gray-700"></ul>
    <div class="border-t border-gray-200 pt-4 flex flex-col gap-2.5 text-sm text-gray-600">
      <p class="text-xs font-medium text-gray-500 uppercase tracking-wider">Reading a tag</p>
      <div class="flex items-center gap-2"><span class="inline-flex items-center text-sm px-2 py-0.5 rounded-full bg-blue-100 text-blue-800">hm-review</span><span>Status</span></div>
      <div class="flex items-center gap-2"><span class="inline-flex items-center text-sm px-2 py-0.5 rounded-full bg-yellow-100 text-yellow-800">strong-yes</span><span>Priority</span></div>
      <div class="flex items-center gap-2"><span class="inline-flex items-center text-sm px-2 py-0.5 rounded-full bg-green-100 text-green-800">react</span><span>Skill</span></div>
      <div class="flex items-center gap-2"><span class="inline-flex items-center text-sm px-2 py-0.5 rounded-full bg-gray-100 text-gray-800">referral</span><span>Source or platform</span></div>

</div>

const norm=s=>String(s).toLowerCase().replace(/^#/,"").replace(/[\s_\-.]+/g,"");
function lev(a,b){ if(a===b) return 0; const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; }
  return prev[n]; }
const slug=s=>String(s).trim().toLowerCase().replace(/^#/,"").replace(/[^a-z0-9+]+/g,"-").replace(/^-+|-+$/g,"").slice(0,32);
function matchTag(t,q){ const nq=norm(q); if(!nq) return null; const nn=norm(t.name);
  if(nn===nq) return {score:100,why:"Exact match"};
  for(const a of t.aliases) if(norm(a)===nq) return {score:95,why:`Synonym “${a}”`};
  if(nn.startsWith(nq)) return {score:80,why:""};
  for(const a of t.aliases) if(norm(a).startsWith(nq)) return {score:70,why:`Synonym “${a}”`};
  if(nn.includes(nq)) return {score:55,why:""};
  if(nq.length>=4){ const d=Math.min(lev(nq,nn.slice(0,Math.max(nq.length,nn.length))),lev(nq,nn));

  events:[],toast:null,undo:null,done:{employer:new Set(),seeker:new Set()},db:{employer:build("employer"),seeker:build("seeker")}};
const D=()=>S.db[S.persona], C=()=>D().cfg;
const tagById=id=>D().tags.find(t=>t.id===id);
const active=()=>D().tags.filter(t=>t.state==="active");
const itemCount=id=>D().items.filter(i=>i.tags.has(id)).length;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const plural=(n,a,b)=>n===1?a:b;
function log(type,data){ S.events.push(Object.assign({type,persona:S.persona,device:S.device,at:Date.now()},data||{})); }
function markDone(k){ if(!S.done[S.persona].has(k)){ S.done[S.persona].add(k); renderTasks(); } }

function suggest(ids){
  const items=D().items.filter(i=>ids.includes(i.id));
  const onAll=new Set(active().filter(t=>items.every(i=>i.tags.has(t.id))).map(t=>t.id));
  const score=new Map(),why=new Map();
  const add=(id,s,w)=>{ if(onAll.has(id)) return; const t=tagById(id); if(!t||t.state!=="active") return;
    score.set(id,(score.get(id)||0)+s); if(!why.has(id)||s>=30) why.set(id,w); };
  for(const it of items){
    for(const sk of it.skills) for(const t of active()) if(norm(t.name)===norm(sk)||t.aliases.some(a=>norm(a)===norm(sk))) add(t.id,50,C().contentWhy);
    for(const tid of it.tags) for(const o of D().items){ if(o===it||!o.tags.has(tid)) continue;
      for(const x of o.tags) if(!it.tags.has(x)){ const t=tagById(x); if(t&&t.group!=="skill") add(x,14,`Often used with ${tagById(tid).name}`); } }
  }
  D().recent.slice(0,4).forEach((id,k)=>add(id,32-k*4,"You used recently"));
  for(const t of active()) if(t.scope!=="personal"&&t.group==="status"&&t.last<=3) add(t.id,6+Math.log10(1+t.base)*3,t.scope==="team"?`Active in ${C().teamName}`:"Popular on the platform");
  return [...score.entries()].sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id])=>({tag:tagById(id),why:why.get(id),source:"suggestion"}));
}
function search(q,ex){ const out=[];
  for(const t of active()){ if(ex&&ex.has(t.id)) continue; const m=matchTag(t,q);
    if(m) out.push({tag:t,why:m.why,score:m.score+Math.log10(1+t.base+itemCount(t.id)*5)*2,source:"search"}); }
  return out.sort((a,b)=>b.score-a.score).slice(0,5); }
function nearDuplicate(q){ const nq=norm(q); if(nq.length<3) return null; let best=null;
  for(const t of active()){ const d=Math.min(lev(nq,norm(t.name)),...t.aliases.map(a=>lev(nq,norm(a)))); if(d===0) return null; if(d<=2&&(!best||d<best.d)) best={tag:t,d}; }
  return best; }

function applyTag(tagId,ids,source,rank){
  const changed=[]; for(const it of D().items) if(ids.includes(it.id)&&!it.tags.has(tagId)){ it.tags.add(tagId); changed.push(it.id); }
  const t=tagById(tagId); t.last=0; D().recent=[tagId,...D().recent.filter(x=>x!==tagId)].slice(0,8);
  log("tag_applied",{tag:t.name,source,rank,n:changed.length,ms:S.picker?Date.now()-S.picker.openedAt:null});
  if(changed.length){ const who=ids.length>1?`${changed.length} ${C().nouns}`:D().items.find(i=>i.id===changed[0]).name;
    D().feed.unshift({text:`You tagged ${who} ${t.name}`,when:"Just now"});
    toast("Tag added",`${esc(t.name)} added to ${esc(who)}.`,{type:"apply",tagId,ids:changed}); }
  if(ids.length>=3||(S.persona==="seeker"&&ids.length>=2)) markDone("bulk");
  if(S.device==="mobile") markDone("device");
}
function removeTag(ids,tagId){ const changed=[];
  for(const it of D().items) if(ids.includes(it.id)&&it.tags.has(tagId)){ it.tags.delete(tagId); changed.push(it.id); }
  if(!changed.length) return; log("tag_removed",{tag:tagById(tagId).name});
  toast("Tag removed",`${esc(tagById(tagId).name)} removed.`,{type:"remove",tagId,ids:changed}); }
function createTag(name,scope){ const s=slug(name); if(!s) return null;
  const ex=active().find(t=>norm(t.name)===norm(s)); if(ex) return ex;
  const t={id:S.persona[0]+"n"+Date.now(),name:s,group:scope==="personal"?"personal":"status",scope,aliases:[],base:0,last:0,state:"active"};
  D().tags.push(t); log("tag_created",{tag:s,scope}); return t; }
function mergeTag(fromId,intoId){ const f=tagById(fromId),t=tagById(intoId);
  for(const it of D().items) if(it.tags.has(fromId)){ it.tags.delete(fromId); it.tags.add(intoId); }
  f.state="merged"; t.aliases.push(f.name);
  D().views.forEach(v=>v.all=v.all.map(x=>x===fromId?intoId:x)); S.filters=S.filters.map(x=>x===fromId?intoId:x);
  log("tag_merged",{from:f.name,into:t.name}); D().feed.unshift({text:`You merged ${f.name} into ${t.name}`,when:"Just now"});
  markDone("merge"); toast("Tags merged",`${esc(f.name)} now points to ${esc(t.name)}. Searching “${esc(f.name)}” still finds it.`,null); }
function toast(title,msg,undo){ S.toast={title,msg}; S.undo=undo; renderToast(); clearTimeout(toast.t); toast.t=setTimeout(()=>{S.toast=null;S.undo=null;renderToast();},5200); }
function doUndo(){ const u=S.undo; if(!u) return;
  for(const it of D().items) if(u.ids.includes(it.id)){ u.type==="apply"?it.tags.delete(u.tagId):it.tags.add(u.tagId); }
  log("tag_undo",{}); S.toast=null; S.undo=null; renderToast(); renderBody(); if(S.picker) renderPickerBody(); }

/* ---------- Hygiene: tertiary tabs + action cards + grid ---------- */
function hygieneIssues(){ const out=[],act=active(),seen=new Set();
  for(const a of act){ if(a.scope!=="personal") continue;
    for(const b of act){ if(a===b) continue; const k=[a.id,b.id].sort().join("|"); if(seen.has(k)) continue;
      if(lev(norm(a.name),norm(b.name))<=1){ seen.add(k); let f=a,t=b; if(b.scope==="personal"&&itemCount(a.id)>itemCount(b.id)){f=b;t=a;} out.push({kind:"dup",from:f,into:t}); } } }
  for(const t of act) if(t.last>=90&&itemCount(t.id)===0) out.push({kind:"stale",tag:t});
  for(const t of act) if(t.scope==="personal"&&itemCount(t.id)>=3) out.push({kind:"promote",tag:t});
  return out; }
function actionCard(border,iconBg,icon,title,body,actions){ return `<div class="bg-white rounded-md shadow-sm border ${border} px-[18px] py-5 flex flex-col gap-3">
  <div class="flex items-start gap-3"><div class="p-2 rounded-full ${iconBg} flex-none">${icon}</div><div class="min-w-0"><p class="text-sm font-semibold text-gray-800">${title}</p><div class="text-sm text-gray-600 mt-1">${body}</div></div></div>
  <div class="flex justify-end gap-2 mt-auto">${actions}</div></div>`; }
function hygieneView(){ const c=C(), issues=hygieneIssues();
  const rows=active().slice().sort((a,b)=>(itemCount(b.id)+b.base/50)-(itemCount(a.id)+a.base/50));
  const tabs=`<div class="flex gap-2 bg-gray-100 px-2 py-1.5 rounded-md shadow-sm text-sm font-medium w-max max-w-full">
    <button data-act="hytab" data-hy="review" class="px-3 py-1 rounded ${S.hyTab==="review"?"bg-white text-blue-600":"text-gray-700 hover:text-blue-600"}">Needs review (${issues.length})</button>
    <button data-act="hytab" data-hy="all" class="px-3 py-1 rounded ${S.hyTab==="all"?"bg-white text-blue-600":"text-gray-700 hover:text-blue-600"}">All tags (${rows.length})</button></div>`;
  const cards=issues.map(x=>{
    if(x.kind==="dup") return actionCard("border-[#FFDD8A]","bg-yellow-100 text-yellow-700",ic("merge","w-4 h-4"),"Possible duplicate",
      `<div class="flex flex-wrap items-center gap-1.5">${pill(x.from)}<span>looks like</span>${pill(x.into)}</div><p class="mt-2">Merging moves ${itemCount(x.from.id)} ${plural(itemCount(x.from.id),c.noun,c.nouns)}. “${esc(x.from.name)}” keeps working as a synonym.</p>`,
      `<button class="${btnPrimary} !py-1.5" data-act="merge" data-from="${x.from.id}" data-into="${x.into.id}">Merge into ${esc(x.into.name)}</button>`);
    if(x.kind==="stale") return actionCard("border-gray-200","bg-gray-100 text-gray-600",ic("clock","w-4 h-4"),`Unused for ${x.tag.last} days`,
      `<div>${pill(x.tag)}</div><p class="mt-2">Archiving removes it from suggestions. History and reports keep it.</p>`,
      `<button class="${btnSecondary} !py-1.5" data-act="archive" data-tag="${x.tag.id}">Archive</button>`);
    return actionCard("border-[#BFDBFE]","bg-blue-100 text-blue-600",ic("share","w-4 h-4"),"Popular personal tag",
      `<div class="flex items-center gap-1.5">${pill(x.tag)}<span>on ${itemCount(x.tag.id)} ${c.nouns}</span></div><p class="mt-2">Share it so ${esc(c.teamName)} can use and filter by it.</p>`,

function median(a){ if(!a.length) return null; const s=a.slice().sort((x,y)=>x-y),m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; }
function kpi(icon,bg,fg,label,value,note,noteCls){ return `<div class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm"><div class="flex items-start gap-4">
  <div class="p-2 rounded-full ${bg} ${fg} flex-none">${ic(icon,"w-5 h-5")}</div><div class="min-w-0"><p class="text-sm font-medium ${fg.replace("600","700")}">${label}</p>
  <p class="text-2xl font-bold text-gray-900 tabular-nums">${value}</p><p class="text-xs ${noteCls||"text-gray-500"} mt-1">${note}</p></div></div></div>`; }
function insightsView(){ const c=C(), ev=S.events.filter(e=>e.persona===S.persona), ap=ev.filter(e=>e.type==="tag_applied");
  const sug=ap.filter(e=>e.source==="suggestion").length, cr=ev.filter(e=>e.type==="tag_created").length,

  const pct=(a,b)=>b?Math.round(a/b*100)+"%":"–";
  const top=active().map(t=>({t,n:itemCount(t.id)})).filter(x=>x.n).sort((a,b)=>b.n-a.n).slice(0,7), max=Math.max(1,...top.map(x=>x.n));
  const cov=D().items.filter(i=>[...i.tags].some(id=>{const t=tagById(id);return t&&t.group==="status"&&t.state==="active";})).length;
  return `<div class="flex flex-col gap-4"><div><h2 class="text-lg font-semibold text-gray-800">Insights</h2><p class="text-sm text-gray-500">Measured live from what you do in this session. Targets come from the metrics plan.</p></div>

    ${kpi("tag","bg-blue-100","text-blue-600","Tags applied",ap.length,`From ${op} picker ${plural(op,"open","opens")}`)}
    ${kpi("sparkles","bg-purple-100","text-purple-600","From suggestions",pct(sug,ap.length),"Target 60% or more",ap.length&&sug/ap.length>=.6?"text-green-600":"text-gray-500")}
    ${kpi("clock","bg-green-100","text-green-600","Median time to tag",med==null?"–":(med/1000).toFixed(1)+" s","Target 3 s or less",med!=null&&med<=3000?"text-green-600":"text-gray-500")}
    ${kpi("plus","bg-yellow-100","text-yellow-600","New tags per 10",ap.length?(cr/ap.length*10).toFixed(1):"–","Lower means less clutter")}
    ${kpi("search","bg-blue-100","text-blue-600","Recalls via tags",rec,"Filters and views opened")}
    ${kpi("undo","bg-red-100","text-red-600","Undo or remove rate",pct(und,ap.length),"Guardrail 10% or less")}
   </div>
   <div class="grid gap-4" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
    <section class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm"><h3 class="text-sm font-semibold text-gray-800">Tags in use</h3><p class="text-xs text-gray-500 mb-4">${c.nouns[0].toUpperCase()+c.nouns.slice(1)} per tag · ${cov} of ${D().items.length} have a status tag</p>
      <div class="flex flex-col gap-2.5">${top.map(x=>`<div class="grid items-center gap-3" style="grid-template-columns:140px minmax(0,1fr) 24px"><span class="min-w-0 truncate">${pill(x.t)}</span><div class="h-2 rounded-full bg-gray-100 overflow-hidden"><div class="h-full rounded-full bg-blue-600" style="width:${x.n/max*100}%"></div></div><span class="text-sm text-right tabular-nums text-gray-700">${x.n}</span></div>`).join("")}</div></section>
    <section class="rounded-xl border border-gray-200 bg-white shadow-sm"><div class="p-5 pb-3"><h3 class="text-sm font-semibold text-gray-800">Activity</h3><p class="text-xs text-gray-500">Who tagged what</p></div>
      <ul class="divide-y divide-gray-100 border-t border-gray-100">${D().feed.slice(0,6).map(f=>`<li class="px-5 py-2.5 flex justify-between gap-3 text-sm"><span class="text-gray-700 min-w-0">${esc(f.text)}</span><span class="text-xs text-gray-500 whitespace-nowrap">${esc(f.when)}</span></li>`).join("")}</ul></section>

/* ---------- Tag picker: the library's multi-select dropdown with tag pills ---------- */
function openPicker(mode,ids,anchor){
  let pos=null; if(anchor){ const r=anchor.getBoundingClientRect(), s=screen.getBoundingClientRect();
    let left=r.left-s.left, top=r.bottom-s.top+6; left=Math.max(12,Math.min(left,s.width-372)); if(top+440>s.height-12) top=Math.max(12,r.top-s.top-446); pos={left,top}; }
  S.picker={mode,targets:ids,query:"",hi:0,openedAt:Date.now(),scope:"personal",opts:[],pos};
  log("picker_opened",{mode,n:ids.length}); if(mode==="tag") markDone("open");
  renderPicker(); if(mode==="filter") renderBody();
  setTimeout(()=>{ const i=document.getElementById("pickerInput"); if(i) i.focus(); },20); }
function closePicker(){ S.picker=null; renderPicker(); renderBody(); }
function renderPicker(){ const ov=document.getElementById("overlay"); if(!ov) return; const p=S.picker; if(!p){ ov.innerHTML=""; return; }
  const c=C(); const title=p.mode==="filter"?`Filter ${c.nouns} by tag`:p.targets.length>1?`Tag ${p.targets.length} ${c.nouns}`:`Tag ${esc(D().items.find(i=>i.id===p.targets[0]).name)}`;
  const posStyle=p.pos?`left:${p.pos.left}px;top:${p.pos.top}px`:`left:50%;top:80px;transform:translateX(-50%)`;
  ov.innerHTML=`<div class="scrim absolute inset-0 z-20 bg-gray-900/30 ${p.pos?"hidden":""}" data-act="close-picker"></div>
   <div class="picker bg-white border border-gray-200 rounded-md shadow-md flex flex-col" style="${posStyle}" role="dialog" aria-modal="true" aria-label="${p.mode==="filter"?"Filter by tag":"Tag picker"}">
    <div class="only-mobile justify-center pt-2"><span class="w-10 h-1 rounded-full bg-gray-300"></span></div>
    <div class="flex items-center justify-between px-4 pt-3"><p class="text-sm font-semibold text-gray-800 truncate">${title}</p>
      <button class="text-gray-400 hover:text-gray-700" data-act="close-picker" aria-label="Close">${ic("x","w-4 h-4")}</button></div>
    <div class="px-4 pt-2 pb-3 border-b border-gray-200">
      <div class="border border-blue-600 rounded-md px-3 py-2 flex flex-wrap items-center gap-2 bg-white">
        <span id="pickerPills" class="contents"></span>
        <input id="pickerInput" type="text" autocomplete="off" spellcheck="false" placeholder="${p.mode==="filter"?"Search tags…":"Search or create…"}" class="flex-1 min-w-[90px] text-sm text-gray-700 focus:outline-none" aria-label="Search tags">
        <span class="text-blue-600">${ic("up","w-4 h-4")}</span></div></div>
    <div id="pickerBody" class="overflow-y-auto flex-1 py-1" role="listbox" aria-multiselectable="true"></div>
    <div class="flex items-center justify-between gap-3 px-4 py-3 border-t border-gray-200 bg-gray-50 rounded-b-md">
      <span class="text-xs text-gray-500" id="pickerHint"></span><button class="${btnPrimary} !py-1.5" data-act="close-picker">Done</button></div>
   </div>`;
  renderPickerBody(); }
function pickerData(){ const p=S.picker, items=D().items.filter(i=>p.targets.includes(i.id));
  if(p.mode==="filter"){ const on=new Set(S.filters);
    const list=p.query?search(p.query,null):active().filter(t=>itemCount(t.id)).sort((a,b)=>itemCount(b.id)-itemCount(a.id)).slice(0,10).map(t=>({tag:t,source:"filter"}));
    return {sections:[[p.query?"Matches":"Tags in this list",list.map(o=>Object.assign(o,{why:`${itemCount(o.tag.id)} ${plural(itemCount(o.tag.id),C().noun,C().nouns)}`,on:on.has(o.tag.id)}))]]}; }
  const onAll=new Set(active().filter(t=>items.every(i=>i.tags.has(t.id))).map(t=>t.id));
  if(!p.query) return {sections:[["Smart suggestions",suggest(p.targets).map(o=>Object.assign(o,{on:false}))]],applied:[...onAll]};
  const res=search(p.query,null).map(o=>Object.assign(o,{on:onAll.has(o.tag.id)}));
  const exact=res.some(r=>norm(r.tag.name)===norm(p.query)||r.tag.aliases.some(a=>norm(a)===norm(p.query)));
  const dup=!exact?nearDuplicate(p.query):null;
  return {sections:[["Matches",res]],create:exact?null:slug(p.query),dup:dup?dup.tag:null,applied:[...onAll]}; }
function renderPickerBody(){ const p=S.picker; if(!p) return; const box=document.getElementById("pickerBody"); if(!box) return;
  const d=pickerData(), flat=[]; let h="";
  const pills=p.mode==="filter"?S.filters.map(id=>pill(tagById(id),{remove:"filter-remove-p"})):(d.applied||[]).map(id=>pill(tagById(id),{remove:"remove-in-picker"}));
  document.getElementById("pickerPills").innerHTML=pills.join("");
  if(d.dup){ markDone("dup"); h+=`<div class="mx-4 my-2 flex items-start gap-2 bg-yellow-50 border border-yellow-300 rounded-md px-3 py-2 text-sm text-yellow-900">${ic("warn","w-4 h-4 flex-none mt-0.5 text-yellow-600")}<span>“${esc(p.query)}” looks like <b>${esc(d.dup.name)}</b>. Use the existing tag so there is one tag per idea.</span></div>`; }
  for(const [title,list] of d.sections){
    const ai=title==="Smart suggestions";
    h+=`<div class="px-4 pt-2 pb-1 flex items-center justify-between text-xs font-medium uppercase tracking-wider ${ai?"text-purple-600":"text-gray-500"}"><span class="flex items-center gap-1.5">${ai?ic("sparkles","w-3.5 h-3.5"):""}${title}</span>${ai?`<span class="normal-case tracking-normal font-normal text-gray-400">Up to 5</span>`:""}</div>`;
    if(!list.length&&!d.create) h+=`<p class="px-4 py-3 text-sm text-gray-500">${ai?"No suggestions yet. Type to search.":"No tags match."}</p>`;
    list.forEach(o=>{ const i=flat.length; flat.push({kind:"tag",o,rank:i+1});
      if(o.why&&o.why.startsWith("Synonym")) markDone("alias");
      h+=`<button class="opt w-full flex items-center gap-3 px-4 py-2 text-left ${p.hi===i?"bg-blue-50":"hover:bg-gray-50"}" id="opt-${i}" role="option" aria-selected="${o.on}" data-act="pick" data-i="${i}">
        <span class="cb ${o.on?"on":""}"></span>${pill(o.tag)}<span class="ml-auto text-xs ${ai?"text-purple-600":"text-gray-500"} text-right truncate min-w-0">${esc(o.why||C().scopes[o.tag.scope])}</span></button>`; }); }
  if(d.create&&p.mode==="tag"){ const i=flat.length; flat.push({kind:"create",name:d.create});
    h+=`<div class="mx-4 mt-2 mb-1 border border-dashed border-gray-300 rounded-md p-3 flex flex-col gap-2">
      <button class="opt flex items-center gap-2 text-sm text-left rounded ${p.hi===i?"text-blue-700 font-semibold":"text-blue-600 font-medium"}" id="opt-${i}" data-act="pick" data-i="${i}">${ic("plus","w-4 h-4")}${d.dup?"Create anyway:":"Create"} “${esc(d.create)}”</button>
      <div class="flex items-center gap-4 text-sm text-gray-700" role="radiogroup" aria-label="Who can see the new tag">${["personal","team"].map(s=>`<label class="flex items-center gap-2 cursor-pointer"><input type="radio" class="custom-radio" name="newScope" data-act="scope" data-scope="${s}" ${p.scope===s?"checked":""}>${esc(C().scopes[s])}</label>`).join("")}</div></div>`; }
  box.innerHTML=h; p.opts=flat; if(p.hi>=flat.length) p.hi=Math.max(0,flat.length-1);
  document.getElementById("pickerHint").textContent=p.mode==="filter"?"Filters combine: all must match":p.targets.length>1?`Applies to all ${p.targets.length} selected`:"Saved instantly · Esc to close"; }
function choose(i){ const p=S.picker, f=p.opts[i]; if(!f) return;
  if(p.mode==="filter"){ const id=f.o.tag.id; S.filters.includes(id)?S.filters=S.filters.filter(x=>x!==id):(S.filters.push(id),log("filter_used",{tag:f.o.tag.name}),markDone("filter")); renderBody(); renderPickerBody(); return; }
  if(f.kind==="create"){ const t=createTag(f.name,p.scope); if(t) applyTag(t.id,p.targets,"create",null); }
  else if(f.o.on) removeTag(p.targets,f.o.tag.id);
  else applyTag(f.o.tag.id,p.targets,f.o.source==="suggestion"?"suggestion":"search",f.rank);
  p.query=""; p.hi=0; const inp=document.getElementById("pickerInput"); if(inp){ inp.value=""; inp.focus(); }
  renderPickerBody(); renderBody(); }

function renderToast(){ const slot=document.getElementById("toastSlot"); if(!slot) return; const t=S.toast;

/* ---------- events ---------- */
screen.addEventListener("click",e=>{ const a=e.target.closest("[data-act]"); if(!a) return; const act=a.dataset.act;
  if(act==="tab"){ S.tab=a.dataset.tab; S.picker=null; renderApp(); return; }
  if(act==="open-tag"){ openPicker("tag",[a.dataset.item],S.device==="desktop"?a:null); return; }
  if(act==="open-bulk"){ openPicker("tag",[...S.selected],S.device==="desktop"?a:null); return; }
  if(act==="open-filter"){ openPicker("filter",[],S.device==="desktop"?a.parentElement:null); return; }
  if(act==="close-picker"){ closePicker(); return; }
  if(act==="pick"){ choose(+a.dataset.i); return; }
  if(act==="scope"){ S.picker.scope=a.dataset.scope; return; }
  if(act==="remove-in-picker"){ removeTag(S.picker.targets,a.dataset.tag); renderPickerBody(); renderBody(); return; }
  if(act==="filter-remove-p"){ S.filters=S.filters.filter(x=>x!==a.dataset.tag); renderPickerBody(); renderBody(); return; }
  if(act==="filter-add"){ if(!S.filters.includes(a.dataset.tag)) S.filters.push(a.dataset.tag); log("filter_used",{tag:tagById(a.dataset.tag).name}); markDone("filter"); renderBody(); return; }
  if(act==="filter-remove"){ S.filters=S.filters.filter(x=>x!==a.dataset.tag); renderBody(); return; }
  if(act==="save-view"){ const nm=S.filters.map(id=>tagById(id).name).join(" + "); D().views.push({name:nm,desc:"Saved from a filter",all:S.filters.slice(),shared:false}); log("view_saved",{}); toast("View saved",`“${esc(nm)}” is in Smart views.`,null); renderBody(); return; }
  if(act==="open-view"){ const v=D().views[+a.dataset.view]; S.filters=v.all.slice(); S.tab="items"; log("view_opened",{name:v.name}); markDone("filter"); renderApp(); return; }
  if(act==="sel"){ a.checked?S.selected.add(a.dataset.item):S.selected.delete(a.dataset.item); renderBody(); return; }
  if(act==="sel-all"){ const ids=visible().map(i=>i.id); a.checked?ids.forEach(i=>S.selected.add(i)):ids.forEach(i=>S.selected.delete(i)); renderBody(); return; }
  if(act==="clear-sel"){ S.selected.clear(); renderBody(); return; }
  if(act==="hytab"){ S.hyTab=a.dataset.hy; renderBody(); return; }
  if(act==="merge"){ mergeTag(a.dataset.from,a.dataset.into); rerenderShell(); return; }
  if(act==="archive"){ const t=tagById(a.dataset.tag); t.state="archived"; log("tag_archived",{tag:t.name}); toast("Tag archived",`${esc(t.name)} no longer appears in suggestions.`,null); rerenderShell(); return; }
  if(act==="promote"){ const t=tagById(a.dataset.tag); t.scope="team"; t.group="priority"; log("tag_promoted",{tag:t.name}); D().feed.unshift({text:`You shared ${t.name} with ${C().teamName}`,when:"Just now"}); toast("Tag shared",`${esc(t.name)} is now visible to ${esc(C().teamName)}.`,null); rerenderShell(); return; }
  if(act==="undo"){ doUndo(); return; }
  if(act==="dismiss"){ S.toast=null; renderToast(); return; }
});

  if(h.includes("insights")){ const ids=D().items.map(i=>i.id); for(let k=0;k<4;k++) log("picker_opened",{mode:"tag",n:1});
    [[0,1,2100,"suggestion"],[3,3,2800,"suggestion"],[6,5,4300,"search"]].forEach(([t,i,ms,src])=>{ S.picker={openedAt:Date.now()-ms}; applyTag(active()[t].id,[ids[i]],src,1); });
    S.picker=null; log("filter_used",{}); log("view_opened",{}); S.toast=null; renderBody(); renderToast(); }
  if(h.includes("bulk")){ D().items.slice(0,3).forEach(i=>S.selected.add(i.id)); renderBody(); }
  if(h.includes("picker")){ const btn=S.device==="desktop"?screen.querySelector('[data-act="open-tag"]'):null; openPicker("tag",[D().items[0].id],btn);
    const q=h.includes("js")?(S.persona==="seeker"?"wfh":"js"):h.includes("dup")?(S.persona==="seeker"?"dreamjb":"frontnd"):"";
    if(q){ S.picker.query=q; document.getElementById("pickerInput").value=q; renderPickerBody(); } }
  if(h.includes("toast")) toast("Tag added","strong-yes added to Sofia Martins.",{type:"apply",tagId:active()[3].id,ids:[]});
}
boot();
})();
</script>
